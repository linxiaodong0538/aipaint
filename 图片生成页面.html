    <script>
            function toggleRefMode() {
                const badge = document.getElementById('ref-mode-badge');
                badge.classList.toggle('hidden');
            }
    
            function setResolution(res) {
                const btns = document.querySelectorAll('#res-selector button');
                btns.forEach(b => b.classList.remove('active'));
                document.querySelector(`button[data-res="${res}"]`).classList.add('active');
    
                const container = document.getElementById('ratio-container');
                const ratioBtns = container.querySelectorAll('.ratio-btn');
                
                if (res === '4K') {
                    // Hide 1:1, 4:3, 3:4
                    ratioBtns.forEach(btn => {
                        const text = btn.innerText;
                        if (['1:1', '4:3', '3:4'].includes(text)) {
                            btn.style.display = 'none';
                        }
                    });
                    // Default to 16:9 if current is hidden
                    const currentActive = container.querySelector('.bg-primary');
                    if (currentActive && ['1:1', '4:3', '3:4'].includes(currentActive.innerText)) {
                        setActiveRatio(ratioBtns[3]); // 16:9
                    }
                } else {
                    ratioBtns.forEach(btn => btn.style.display = 'block');
                }
    
                // UI feedback for premium modal placeholder
                if (res === '1K') {
                    console.log("Pre-fetching high quality assets...");
                }
            }
    
            function setActiveRatio(target) {
                const btns = document.querySelectorAll('.ratio-btn');
                btns.forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary', 'ring-4', 'ring-primary/10');
                    b.classList.add('border', 'border-outline-variant/30');
                });
                target.classList.remove('border', 'border-outline-variant/30');
                target.classList.add('bg-primary', 'text-on-primary', 'ring-4', 'ring-primary/10');
            }
    
            document.querySelectorAll('.ratio-btn').forEach(btn => {
                btn.addEventListener('click', () => setActiveRatio(btn));
            });
    
            function startGenerating() {
                const overlay = document.getElementById('progress-state');
                const fill = document.getElementById('progress-bar-fill');
                const percent = document.getElementById('progress-percent');
                overlay.classList.remove('hidden');
                
                let p = 0;
                const interval = setInterval(() => {
                    p += Math.floor(Math.random() * 5) + 2;
                    if (p >= 100) {
                        p = 100;
                        clearInterval(interval);
                        setTimeout(() => {
                            overlay.classList.add('hidden');
                            document.getElementById('result-view').classList.remove('hidden');
                        }, 500);
                    }
                    percent.innerText = `${p}%`;
                    fill.style.width = `${p}%`;
                    // Simple rotate animation for circle clip-path
                    document.getElementById('progress-circle').style.transform = `rotate(${p * 3.6}deg)`;
                }, 100);
            }
    
            function closeResult() {
                document.getElementById('result-view').classList.add('hidden');
                document.getElementById('progress-bar-fill').style.width = '0%';
                document.getElementById('progress-percent').innerText = '0%';
            }
        </script>
