<style>
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .glass-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* AI Thinking Animation */
        .ai-pulse {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); filter: blur(0px); }
            50% { opacity: 0.5; transform: scale(1.1); filter: blur(4px); }
        }

        .orbit-container {
            position: relative;
            width: 240px;
            height: 240px;
        }
        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .orbit-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: black;
            border-radius: 50%;
            top: -4px;
            left: 50%;
            margin-left: -4px;
        }
        .animate-orbit {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .fade-out { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        .fade-in { opacity: 1; transition: opacity 0.8s ease 0.2s; }

        .shadow-soft {
            box-shadow: 0px 20px 40px rgba(0,0,0, 0.05);
        }
        .inner-glow {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="overflow-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 bg-background/80 dark:bg-background/80 backdrop-blur-xl flex justify-between items-center px-container-margin h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">VisionAI</h1>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95" id="close-btn">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</header>
<main class="relative w-full h-screen flex flex-col items-center justify-center pt-16 pb-24 px-6 overflow-hidden">
<!-- STATE 1: In Progress -->
<section class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 ease-in-out" id="progress-state">
<div class="orbit-container mb-12">
<div class="orbit-ring w-56 h-56 animate-orbit" style="animation-duration: 12s;">
<div class="orbit-particle bg-black/20"></div>
</div>
<div class="orbit-ring w-40 h-40 animate-orbit" style="animation-duration: 6s; animation-direction: reverse;">
<div class="orbit-particle bg-black/40"></div>
</div>
<div class="orbit-ring w-24 h-24 animate-orbit" style="animation-duration: 4s;">
<div class="orbit-particle bg-black"></div>
</div>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-12 h-12 bg-black rounded-full ai-pulse"></div>
</div>
</div>
<div class="text-center space-y-4 max-w-xs">
<h2 class="font-headline-md text-headline-md text-primary" id="progress-title">灵感捕捉中...</h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-70">您的创意正在转化为现实，请稍候</p>
</div>
<div class="w-full max-w-sm mt-12 px-8">
<div class="flex justify-between mb-2">
<span class="font-label-sm text-label-sm text-outline">PROCESSING</span>
<span class="font-label-sm text-label-sm text-primary font-bold" id="percentage-text">0%</span>
</div>
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-300 ease-out" id="progress-bar" style="width: 0%;"></div>
</div>
</div>
</section>
<!-- STATE 2: Completed (Hidden initially) -->
<section class="opacity-0 pointer-events-none absolute inset-0 flex flex-col items-center justify-center transition-all duration-1000 ease-in-out translate-y-8" id="completed-state">
<div class="relative w-full max-w-md aspect-square px-6">
<div class="w-full h-full rounded-[32px] overflow-hidden shadow-soft border border-black/5 bg-white p-2">
<div class="w-full h-full rounded-[24px] overflow-hidden relative group">
<img alt="Generated AI Art Result" class="w-full h-full object-cover scale-105 transition-transform duration-1000 group-hover:scale-100" src="https://lh3.googleusercontent.com/aida/ADBb0ugEjr50BfrZFUUpvSw5rORTcXg7A1ByxYC9Ro03lQ4he4tJ5LXiXTTrY4d2dwlPPG6LcGOgwh3KAzJ5q11tVvIp-0-d4y3MsfKKi1fQEd8jm37-m-fR5vR_Be7cUIVW4-NRJGz0McWwiOxNnJoRhSI3pn-uP28YcHV1Kj-CZea9ZmUSq8MF-LyEuWyFRgfFq5YZjGHnwKbzajdAsPexAOGsRzyh6sOcsjtM65SyIuQ0emgdbZO-Bcgmfsa-"/>
<!-- Model Badge -->
<div class="absolute top-4 right-4 bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/10">
<span class="material-symbols-outlined text-[14px] text-white" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="text-white font-label-sm text-[10px] tracking-wider uppercase">V2.4 Pro Model</span>
</div>
</div>
</div>
<!-- Secondary Actions -->
<div class="flex justify-center gap-4 mt-8 opacity-0 translate-y-4 transition-all duration-700 delay-500" id="secondary-actions">
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center transition-all group-hover:bg-black group-hover:text-white group-active:scale-90">
<span class="material-symbols-outlined">share</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">分享</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center transition-all group-hover:bg-black group-hover:text-white group-active:scale-90">
<span class="material-symbols-outlined">refresh</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">重新生成</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center transition-all group-hover:bg-black group-hover:text-white group-active:scale-90">
<span class="material-symbols-outlined">edit</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">局部重绘</span>
</button>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl px-container-margin pt-4 pb-10 flex flex-col items-center transform translate-y-full transition-transform duration-700 ease-out border-t border-outline-variant/10" id="bottom-bar">
<button class="w-full max-w-sm bg-primary text-on-primary py-4 rounded-full font-label-lg text-label-lg shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">download</span>
            保存到相册
        </button>
</footer>
<script>
        // Simulation Logic
        const progressState = document.getElementById('progress-state');
        const completedState = document.getElementById('completed-state');
        const progressBar = document.getElementById('progress-bar');
        const percentageText = document.getElementById('percentage-text');
        const progressTitle = document.getElementById('progress-title');
        const bottomBar = document.getElementById('bottom-bar');
        const secondaryActions = document.getElementById('secondary-actions');

        let progress = 0;
        const titles = ['灵感捕捉中...', '正在编织像素...', '优化光影细节...', '最后一步收尾...'];
        
        const updateProgress = () => {
            if (progress < 100) {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                
                const rounded = Math.floor(progress);
                progressBar.style.width = `${rounded}%`;
                percentageText.innerText = `${rounded}%`;
                
                // Change titles occasionally
                if (rounded > 30 && rounded < 50) progressTitle.innerText = titles[1];
                if (rounded > 60 && rounded < 80) progressTitle.innerText = titles[2];
                if (rounded > 90) progressTitle.innerText = titles[3];

                setTimeout(updateProgress, 400 + Math.random() * 800);
            } else {
                transitionToComplete();
            }
        };

        const transitionToComplete = () => {
            // Hide progress state
            progressState.classList.add('fade-out');
            progressState.style.transform = 'scale(0.95) translateY(-20px)';
            
            setTimeout(() => {
                progressState.style.display = 'none';
                
                // Show completed state
                completedState.classList.remove('opacity-0', 'pointer-events-none');
                completedState.classList.add('fade-in');
                completedState.style.transform = 'translateY(0)';
                
                // Show bottom bar
                bottomBar.style.transform = 'translateY(0)';
                
                // Animate secondary actions
                setTimeout(() => {
                    secondaryActions.classList.remove('opacity-0', 'translate-y-4');
                }, 400);

                // Add subtle movement to image on hover or scroll
                document.querySelector('main').addEventListener('mousemove', (e) => {
                    const img = document.querySelector('img');
                    const moveX = (e.clientX - window.innerWidth / 2) / 100;
                    const moveY = (e.clientY - window.innerHeight / 2) / 100;
                    img.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
                });
            }, 800);
        };

        // Start simulation
        window.onload = () => {
            setTimeout(updateProgress, 1000);
        };

        // Close button mock
        document.getElementById('close-btn').onclick = () => {
            document.body.style.opacity = '0';
            setTimeout(() => window.location.reload(), 500);
        };
    </script>
</body></html>
