<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }
        .inner-shadow-button {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">

<main class="w-full max-w-screen-md px-6 pt-6 pb-32 flex flex-col gap-6">
<!-- Data Statistics Section -->
<section class="glass-card rounded-2xl p-8 flex flex-col gap-6">
<div class="grid grid-cols-3 divide-x divide-outline-variant/30 text-center">
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">累计邀请</span>
<span class="font-headline-md text-headline-md text-primary font-bold">0</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">获得香蕉点</span>
<span class="font-headline-md text-headline-md text-primary font-bold">0</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">今日邀请</span>
<span class="font-headline-md text-headline-md text-primary font-bold">0</span>
</div>
</div>
</section>
<!-- Referral Reward Logic / Hero -->
<section class="relative overflow-hidden glass-card rounded-3xl p-10 flex flex-col items-center text-center gap-6">
<div class="w-24 h-24 bg-primary text-white rounded-2xl flex items-center justify-center mb-2 transform rotate-3 shadow-xl">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="flex flex-col gap-2 z-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">分享 VisionAI 创意</h2>
<p class="font-body-md text-body-md text-secondary px-4">
                    每成功邀请一位好友，双方均可获得 <span class="font-bold text-primary">50 香蕉点</span>。
                </p>
</div>
<!-- Decorative background elements -->
<div class="absolute -top-10 -right-10 w-40 h-40 bg-surface-container rounded-full opacity-50 blur-3xl"></div>
<div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary/5 rounded-full opacity-50 blur-2xl"></div>
</section>
<!-- Invitation Methods -->
<section class="flex flex-col gap-4">
<button class="w-full h-16 bg-primary text-on-primary rounded-2xl flex items-center justify-center gap-3 font-label-lg text-label-lg inner-shadow-button hover:opacity-90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">share</span>
                微信好友邀请
            </button>
<button class="w-full h-16 bg-white border border-outline-variant/50 text-primary rounded-2xl flex items-center justify-center gap-3 font-label-lg text-label-lg hover:bg-surface-container-low active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">content_copy</span>
                复制邀请链接
            </button>
</section>
<!-- Rules & Activity Details -->
<section class="flex flex-col gap-6">
<h3 class="font-label-lg text-label-lg text-secondary uppercase tracking-[0.2em] border-b border-outline-variant/30 pb-4">活动细则</h3>
<div class="flex flex-col gap-6">
<!-- Rule 1 -->
<div class="flex gap-4">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-primary text-sm">1</div>
<div class="flex flex-col gap-1">
<span class="font-label-lg text-label-lg text-primary">奖励发放</span>
<p class="font-body-md text-body-md text-secondary">受邀好友完成手机号注册后，系统将自动向双方发放奖励，香蕉点即刻到账，可用于 VisionAI 的所有创作功能。</p>
</div>
</div>
<!-- Rule 2 -->
<div class="flex gap-4">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-primary text-sm">2</div>
<div class="flex flex-col gap-1">
<span class="font-label-lg text-label-lg text-primary">新用户定义</span>
<p class="font-body-md text-body-md text-secondary">指从未在 VisionAI 注册过手机号的设备及账号。同一手机号、同一设备均视为同一用户。</p>
</div>
</div>
<!-- Rule 3 -->
<div class="flex gap-4">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-primary text-sm">3</div>
<div class="flex flex-col gap-1">
<span class="font-label-lg text-label-lg text-primary">防作弊声明</span>
<p class="font-body-md text-body-md text-secondary">严禁通过模拟器、虚拟号或通过虚假刷量等不正当手段参与。一经发现，VisionAI 有权冻结账号并收回所有非法所得奖励。</p>
</div>
</div>
</div>
</section>
</main>
<!-- Atmospheric Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('mousedown', () => {
                    btn.classList.add('scale-95');
                });
                btn.addEventListener('mouseup', () => {
                    btn.classList.remove('scale-95');
                });
                btn.addEventListener('mouseleave', () => {
                    btn.classList.remove('scale-95');
                });
            });

            // Parallax-ish effect on scroll for headers
            window.addEventListener('scroll', () => {
                const header = document.querySelector('header');
                if (window.scrollY > 20) {
                    header.classList.add('shadow-sm');
                } else {
                    header.classList.remove('shadow-sm');
                }
            });
        });
    </script>
</body></html>
