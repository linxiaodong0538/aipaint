<!DOCTYPE html><html class="light" lang="en"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Aspect Ratio Selector</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "outline-variant": "#cfc4c5",
                            "outline": "#7e7576",
                            "on-surface": "#1a1c1c",
                            "surface": "#f9f9f9",
                            "secondary-container": "#e2dfde",
                            "surface-container-high": "#e8e8e8",
                            "surface-container": "#eeeeee",
                            "on-primary-container": "#848484",
                            "on-tertiary-fixed": "#1a1c1c",
                            "on-secondary-fixed": "#1c1b1b",
                            "on-tertiary": "#ffffff",
                            "on-secondary-container": "#636262",
                            "on-secondary-fixed-variant": "#474746",
                            "surface-tint": "#5e5e5e",
                            "secondary": "#5f5e5e",
                            "on-surface-variant": "#4c4546",
                            "inverse-primary": "#c6c6c6",
                            "on-primary-fixed": "#1b1b1b",
                            "background": "#f9f9f9",
                            "primary-fixed": "#e2e2e2",
                            "on-tertiary-fixed-variant": "#454747",
                            "on-error-container": "#93000a",
                            "secondary-fixed-dim": "#c8c6c5",
                            "primary": "#000000",
                            "surface-dim": "#dadada",
                            "secondary-fixed": "#e5e2e1",
                            "surface-container-lowest": "#ffffff",
                            "on-tertiary-container": "#838484",
                            "on-primary-fixed-variant": "#474747",
                            "tertiary-fixed-dim": "#c6c6c7",
                            "on-background": "#1a1c1c",
                            "on-primary": "#ffffff",
                            "on-secondary": "#ffffff",
                            "on-error": "#ffffff",
                            "surface-container-highest": "#e2e2e2",
                            "surface-bright": "#f9f9f9",
                            "inverse-surface": "#2f3131",
                            "inverse-on-surface": "#f0f1f1",
                            "surface-variant": "#e2e2e2",
                            "primary-fixed-dim": "#c6c6c6",
                            "tertiary-container": "#1a1c1c",
                            "tertiary": "#000000",
                            "tertiary-fixed": "#e2e2e2",
                            "primary-container": "#1b1b1b",
                            "error-container": "#ffdad6",
                            "error": "#ba1a1a",
                            "surface-container-low": "#f3f3f4"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "stack-xl": "64px",
                            "stack-lg": "32px",
                            "container-padding": "32px",
                            "stack-md": "16px",
                            "unit": "8px",
                            "stack-sm": "8px",
                            "gutter": "24px"
                        },
                        "fontFamily": {
                            "label-sm": ["Plus Jakarta Sans"],
                            "body-lg": ["Plus Jakarta Sans"],
                            "label-lg": ["Plus Jakarta Sans"],
                            "headline-lg-mobile": ["Plus Jakarta Sans"],
                            "headline-lg": ["Plus Jakarta Sans"],
                            "headline-md": ["Plus Jakarta Sans"],
                            "display": ["Plus Jakarta Sans"],
                            "body-md": ["Plus Jakarta Sans"]
                        },
                        "fontSize": {
                            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                            "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                        }
                    }
                }
            }
        </script>
    <style>
            body { font-family: 'Plus Jakarta Sans', sans-serif; }
            .ratio-icon-box { transition: all 0.2s ease; }
            .aspect-card:hover .ratio-icon-box { border-color: currentColor; }
        </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
      </style>
    </head>
    <body class="bg-surface-dim h-screen w-screen flex items-end justify-center overflow-hidden antialiased relative">
    <!-- Mock Background App Content (Out of focus) -->
    <div aria-hidden="true" class="absolute inset-0 z-0 bg-surface flex flex-col pt-12 px-6 blur-sm opacity-50">
    <div class="h-12 w-3/4 bg-surface-container-highest rounded-lg mb-8"></div>
    <div class="grid grid-cols-2 gap-4">
    <div class="h-48 bg-surface-container-highest rounded-2xl"></div>
    <div class="h-48 bg-surface-container-highest rounded-2xl"></div>
    <div class="h-48 bg-surface-container-highest rounded-2xl"></div>
    <div class="h-48 bg-surface-container-highest rounded-2xl"></div>
    </div>
    </div>
    <!-- Backdrop Overlay -->
    <div class="absolute inset-0 bg-primary/20 backdrop-blur-sm z-10"></div>
    <!-- Bottom Drawer -->
    <div class="relative z-20 w-full max-w-md bg-surface-container-lowest rounded-t-xl shadow-2xl flex flex-col pb-0 pt-6 px-0 overflow-hidden"><!-- Drag Handle -->
    <div class="w-full flex justify-center mb-4">
    <div class="w-10 h-1 bg-outline-variant/30 rounded-full"></div>
    </div>
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
    <div class="flex flex-col">
    <h2 class="font-headline-md text-headline-md text-on-surface uppercase tracking-tight">画面比例</h2>
    <span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant/60 font-semibold">传感器配置</span>
    </div>
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface">
    <span class="material-symbols-outlined" style="font-size: 24px;">close</span>
    </button>
    </div>
    <!-- Professional Grid Matrix -->
    <div class="grid grid-cols-2 border-t border-l border-outline-variant/30">
    <!-- Card: 1:1 -->
    <button class="flex flex-col p-5 border-r border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors text-left">
    <div class="flex justify-between items-start mb-4">
    <div class="w-5 h-5 border border-on-surface"></div>
    <span class="px-1.5 py-0.5 rounded-[2px] bg-secondary-container text-[10px] font-bold uppercase tracking-wider text-on-secondary-container">社交</span>
    </div>
    <span class="font-headline-md text-headline-md leading-none mb-1">1:1</span>
    <span class="font-label-sm text-on-surface-variant/70">1080 × 1080 PX</span>
    </button>
    <!-- Card: 16:9 (Active State Example) -->
    <button class="flex flex-col p-5 border-r border-b border-outline-variant/30 bg-primary text-white text-left">
    <div class="flex justify-between items-start mb-4">
    <div class="w-8 h-4.5 border border-white"></div>
    <span class="px-1.5 py-0.5 rounded-[2px] bg-white/20 text-[10px] font-bold uppercase tracking-wider text-white">高清视频</span>
    </div>
    <span class="font-headline-md text-headline-md leading-none mb-1">16:9</span>
    <span class="font-label-sm text-white/70">1920 × 1080 PX</span>
    </button>
    <!-- Card: 4:3 -->
    <button class="flex flex-col p-5 border-r border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors text-left">
    <div class="flex justify-between items-start mb-4">
    <div class="w-7 h-5 border border-on-surface"></div>
    <span class="px-1.5 py-0.5 rounded-[2px] bg-secondary-container text-[10px] font-bold uppercase tracking-wider text-on-secondary-container">经典</span>
    </div>
    <span class="font-headline-md text-headline-md leading-none mb-1">4:3</span>
    <span class="font-label-sm text-on-surface-variant/70">1440 × 1080 PX</span>
    </button>
    <!-- Card: 21:9 -->
    <button class="flex flex-col p-5 border-r border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors text-left">
    <div class="flex justify-between items-start mb-4">
    <div class="w-8 h-3.5 border border-on-surface"></div>
    <span class="px-1.5 py-0.5 rounded-[2px] bg-secondary-container text-[10px] font-bold uppercase tracking-wider text-on-secondary-container">电影</span>
    </div>
    <span class="font-headline-md text-headline-md leading-none mb-1">21:9</span>
    <span class="font-label-sm text-on-surface-variant/70">2560 × 1080 PX</span>
    </button>
    <!-- Card: 9:16 -->
    <button class="flex flex-col p-5 border-r border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors text-left">
    <div class="flex justify-between items-start mb-4">
    <div class="w-4 h-7 border border-on-surface"></div>
    <span class="px-1.5 py-0.5 rounded-[2px] bg-secondary-container text-[10px] font-bold uppercase tracking-wider text-on-secondary-container">手机</span>
    </div>
    <span class="font-headline-md text-headline-md leading-none mb-1">9:16</span>
    <span class="font-label-sm text-on-surface-variant/70">1080 × 1920 PX</span>
    </button>
    <!-- Card: 3:2 -->
    <button class="flex flex-col p-5 border-r border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors text-left">
    <div class="flex justify-between items-start mb-4">
    <div class="w-6 h-4 border border-on-surface"></div>
    <span class="px-1.5 py-0.5 rounded-[2px] bg-secondary-container text-[10px] font-bold uppercase tracking-wider text-on-secondary-container">全画幅</span>
    </div>
    <span class="font-headline-md text-headline-md leading-none mb-1">3:2</span>
    <span class="font-label-sm text-on-surface-variant/70">1536 × 1024 PX</span>
    </button>
    </div></div>
    </body></html>
