<style>
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .technical-grid {
            background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .blueprint-line {
            background: linear-gradient(90deg, transparent 0%, #1a1c1c 50%, transparent 100%);
            height: 1px;
            width: 100%;
            opacity: 0.1;
        }

        /* AI Thinking Animation */
        .ai-pulse {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); filter: blur(0px); }
            50% { opacity: 0.5; transform: scale(1.1); filter: blur(4px); }
        }

        .orbit-container {
            position: relative;
            width: 240px;
            height: 240px;
        }
        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(0,0,0,1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .orbit-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: black;
            border-radius: 50%;
            top: -4px;
            left: 50%;
            margin-left: -4px;
        }
        .animate-orbit {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .fade-out { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        .fade-in { opacity: 1; transition: opacity 0.8s ease 0.2s; }
    </style>
