    <script>
            // Copy functionality
            document.getElementById('copy-btn').addEventListener('click', function() {
                const text = document.getElementById('prompt-text').innerText;
                navigator.clipboard.writeText(text).then(() => {
                    const btnText = this.querySelector('.font-label-sm');
                    const originalText = btnText.innerText;
                    btnText.innerText = 'COPIED!';
                    this.classList.add('bg-primary', 'text-on-primary');
                    setTimeout(() => {
                        btnText.innerText = originalText;
                        this.classList.remove('bg-primary', 'text-on-primary');
                    }, 2000);
                });
            });
    
            // Favorite Toggle
            let isFavorited = false;
            document.getElementById('favorite-btn').addEventListener('click', function() {
                isFavorited = !isFavorited;
                const icon = this.querySelector('.material-symbols-outlined');
                if (isFavorited) {
                    icon.style.fontVariationSettings = "'FILL' 1";
                    icon.classList.add('text-error');
                } else {
                    icon.style.fontVariationSettings = "'FILL' 0";
                    icon.classList.remove('text-error');
                }
            });
    
            // Simple scroll parallax effect on hero image
            window.addEventListener('scroll', function() {
                const hero = document.querySelector('.group img');
                const scroll = window.pageYOffset;
                hero.style.transform = `translateY(${scroll * 0.1}px) scale(${1 + scroll * 0.0002})`;
            });
        </script>
