    <script>
            function switchTab(tab) {
                const tabs = ['all', 'processing', 'completed'];
                const container = document.getElementById('gallery-container');
                const emptyState = document.getElementById('empty-state');
                const items = {
                    processing: document.querySelectorAll('.processing-item'),
                    completed: document.querySelectorAll('.completed-item')
                };
    
                // Update Tab UI
                tabs.forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    if (t === tab) {
                        btn.classList.add('bg-white', 'shadow-sm', 'text-primary-fixed', 'font-bold');
                        btn.classList.remove('text-on-surface-variant');
                    } else {
                        btn.classList.remove('bg-white', 'shadow-sm', 'text-primary-fixed', 'font-bold');
                        btn.classList.add('text-on-surface-variant');
                    }
                });
    
                // Filter logic
                let hasVisibleItems = false;
                
                if (tab === 'all') {
                    items.processing.forEach(el => el.style.display = 'flex');
                    items.completed.forEach(el => el.style.display = 'flex');
                    hasVisibleItems = true;
                } else if (tab === 'processing') {
                    items.processing.forEach(el => el.style.display = 'flex');
                    items.completed.forEach(el => el.style.display = 'none');
                    hasVisibleItems = items.processing.length > 0;
                } else if (tab === 'completed') {
                    items.processing.forEach(el => el.style.display = 'none');
                    items.completed.forEach(el => el.style.display = 'flex');
                    hasVisibleItems = items.completed.length > 0;
                }
    
                // Handle Empty State
                if (hasVisibleItems) {
                    container.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                } else {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                }
            }
        </script>
